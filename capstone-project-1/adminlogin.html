<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Smart Parking App</title>
</head>
<body>
    <div class="container">
        <image src="logo.png" class="logo" alt ="Smart Parking Finder"></image>
        <input type="email" id="email" placeholder="Email"><br><br>
        <input type="password" id="password" placeholder="Password"><br><br>
        <input type="button"value="Login"id="button1"onclick="login()">
        <input type="text"value="Don't have an account?"id="button4">
        <input type="button"value="Sign up"id="button2"onclick="signup()">
        
        
        <div class ="forgot">
        <a href = "forgotpassword.html">Forgot Password?</a>
        
</div>
<script>
    function login() {
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;

  if (email === "" || password === "") {
    alert("Please fill all fields");
  } 
  else if (email === "xyz@gmail.com" && password === "123456") {
    window.location.href = "admindashboard.html"; 
  } 
  else {
    alert("Invalid Email Id or Password");
  }
}
  function signup() {
    window.location.href = "signup.html";
}
</script>
</body>
</html>
